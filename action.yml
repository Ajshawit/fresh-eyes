name: fresh-eyes
description: Review a pull request with a model behind any OpenAI-compatible endpoint, post one comment, and fail unless it approves.
author: ajshawit
branding:
  icon: eye
  color: purple
inputs:
  model:
    description: Model name sent to the endpoint (for ollama, a pulled model such as glm-5.3:cloud or qwen3-coder).
    required: true
  url:
    description: OpenAI-compatible base URL ending in /v1.
    default: http://127.0.0.1:11434/v1
  api-key:
    description: Bearer token for the endpoint. Leave empty for a local daemon.
    default: ''
  config:
    description: Path of the review config, read from the base branch.
    default: .fresh-eyes.json
  out:
    description: Where the review markdown is written.
    default: output/review.md
  github-token:
    description: Token used to post the comment. Needs pull-requests write.
    default: ${{ github.token }}
  reuse:
    description: Reuse the posted verdict for an unchanged head and base instead of asking the model again. Trusts the comment, so keep other workflows' tokens read-only.
    default: 'false'
  bot:
    description: Login the token posts as, so the comment can be found and updated. Change it for a PAT or GitHub App token.
    default: github-actions[bot]
runs:
  using: composite
  steps:
    - shell: bash
      # The reviewer runs from this pinned action, never from the PR, and executes nothing from the checkout.
      # Any FRESH_EYES_* variable set as env on the calling step (for example FRESH_EYES_MAX_DIFF) is seen here too.
      run: node "$GITHUB_ACTION_PATH/review.cjs" "$OUT"
      env:
        REPO_ROOT: ${{ github.workspace }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        FRESH_EYES_MODEL: ${{ inputs.model }}
        FRESH_EYES_URL: ${{ inputs.url }}
        FRESH_EYES_API_KEY: ${{ inputs.api-key }}
        FRESH_EYES_CONFIG: ${{ inputs.config }}
        FRESH_EYES_BOT: ${{ inputs.bot }}
        FRESH_EYES_REUSE: ${{ inputs.reuse }}
        OUT: ${{ inputs.out }}
